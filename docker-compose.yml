version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: slpentry_db
    environment:
      POSTGRES_DB: slpentry_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: